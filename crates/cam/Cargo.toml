[package]
name = "solidcraft-cam"
description = "CAM for SolidCraft: stock setup, tool library, toolpaths and cutrail material-removal simulation"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# Material removal simulation: mesh stock, robust booleans, 3/5-axis sweeps.
cutrail = { version = "0.1", features = ["serde"] }
solidcraft-geom = { workspace = true }
solidcraft-sketch = { workspace = true }
# 2D offsets and booleans for CAM geometry (also in the tree through cutrail).
clipper2-rust = "1.2"
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
