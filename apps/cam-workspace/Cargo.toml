[package]
name = "cam-workspace"
description = "CAM workspace: ribbon, manager panels and 3D viewport (eframe)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# default_fonts: text renders without an installed system font.
# wgpu: the hardware-accelerated renderer; wayland/x11: the Linux window backends.
eframe = { workspace = true, features = ["default_fonts", "wgpu", "wayland", "x11"] }
egui = { workspace = true }
# The viewport's camera, scene description and rasteriser (crates/render).
solidcraft-render = { workspace = true }
# The CAM document: sketch geometry (crates/sketch), solid modeling (crates/kernel) and the
# STEP/DXF readers (crates/io) are SolidCraft's own core, called by the ribbon's tools.
solidcraft-geom = { workspace = true }
solidcraft-sketch = { workspace = true }
solidcraft-kernel = { workspace = true }
solidcraft-io = { workspace = true }
solidcore-record = { workspace = true }
# Z-CAM's machining data model: the tool library the Tool Library dialog edits (crates/cam).
solidcraft-cam = { workspace = true }

[dev-dependencies]
# The screenshot harness writes the PNG the milestone evidence records.
image = { workspace = true }
